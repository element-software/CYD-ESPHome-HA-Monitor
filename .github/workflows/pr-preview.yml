name: PR Preview Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to post the artifact comment on (optional)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: config-generator
        run: npm ci

      - name: Build with Next.js
        working-directory: config-generator
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number || inputs.pr_number || github.run_number }}
          path: config-generator/out
          retention-days: 7

      - name: Comment artifact link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = context.issue.number || parseInt('${{ inputs.pr_number }}') || null;
            if (!prNumber) {
              core.info('No PR number available — skipping PR comment.');
              return;
            }
            const artifactLabel = `pr-preview-${prNumber}`;
            const body = `### 🔍 PR Preview Build\n\nThe static export has been built and uploaded as a workflow artifact.\n\n**[Download preview artifact](${runUrl})** — expand *Artifacts* at the bottom of the run page to download \`${artifactLabel}\`.\n\n> The artifact is a complete static export of the site. Extract it and open \`index.html\` locally to preview your changes.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('PR Preview Build'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
