name: PR Preview Build

# Deploys a live preview to Surge.sh when the SURGE_TOKEN repo secret is set.
# Without SURGE_TOKEN the built output is uploaded as a workflow artifact instead.
#
# One-time setup to enable live preview URLs:
#   1. Create a free account at https://surge.sh
#   2. Run `npx surge token` and copy the token
#   3. Add it as a repository secret named SURGE_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to deploy a preview for (required for workflow_dispatch)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Deploy preview ──────────────────────────────────────────────────────────
  build-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.run_number }}
      SURGE_DOMAIN: cyd-esphome-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_number }}.surge.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: config-generator
        run: npm ci

      - name: Build with Next.js
        working-directory: config-generator
        run: npm run build

      # ── Live preview via Surge.sh (requires SURGE_TOKEN secret) ─────────────
      - name: Deploy live preview to Surge.sh
        if: ${{ secrets.SURGE_TOKEN != '' }}
        run: npx surge config-generator/out "$SURGE_DOMAIN" --token "${{ secrets.SURGE_TOKEN }}"

      - name: Comment live preview URL on PR
        if: ${{ secrets.SURGE_TOKEN != '' }}
        uses: actions/github-script@v7
        env:
          SURGE_DOMAIN: ${{ env.SURGE_DOMAIN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const prNumber = context.issue.number || parseInt(process.env.PR_NUMBER) || null;
            if (!prNumber) {
              core.info('No PR number — skipping comment.');
              return;
            }
            const url = `https://${process.env.SURGE_DOMAIN}`;
            const body = `### 🔍 PR Preview\n\n**Live preview:** ${url}\n\n> Deployed to [Surge.sh](https://surge.sh). Preview is updated on every push and removed when this PR is closed.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('PR Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      # ── Fallback artifact (when SURGE_TOKEN is not configured) ───────────────
      - name: Upload preview artifact (fallback)
        if: ${{ secrets.SURGE_TOKEN == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ env.PR_NUMBER }}
          path: config-generator/out
          retention-days: 7

      - name: Comment artifact link on PR (fallback)
        if: ${{ secrets.SURGE_TOKEN == '' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = context.issue.number || parseInt(process.env.PR_NUMBER) || null;
            if (!prNumber) {
              core.info('No PR number — skipping comment.');
              return;
            }
            const artifactLabel = `pr-preview-${prNumber}`;
            const body = `### 🔍 PR Preview Build\n\nThe static export has been built and uploaded as a workflow artifact.\n\n**[Download preview artifact](${runUrl})** — expand *Artifacts* at the bottom of the run page to download \`${artifactLabel}\`.\n\n> The artifact is a complete static export of the site. Extract it and open \`index.html\` locally to preview your changes.\n\n> 💡 **Want a live preview URL?** Add a \`SURGE_TOKEN\` secret to this repository — see the workflow file for instructions.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('PR Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ── Teardown preview when PR is closed/merged ────────────────────────────────
  teardown-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && secrets.SURGE_TOKEN != ''
    runs-on: ubuntu-latest
    env:
      SURGE_DOMAIN: cyd-esphome-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Teardown Surge preview
        run: npx surge teardown "$SURGE_DOMAIN" --token "${{ secrets.SURGE_TOKEN }}"

      - name: Update PR comment to reflect teardown
        uses: actions/github-script@v7
        env:
          SURGE_DOMAIN: ${{ env.SURGE_DOMAIN }}
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('PR Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `### 🔍 PR Preview\n\nPreview for \`${process.env.SURGE_DOMAIN}\` has been taken down (PR closed).`,
              });
            }
