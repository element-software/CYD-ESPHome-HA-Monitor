# Add these entries to your secrets.yaml file
# e.g. if your device name is "hamon", then the api key should be "hamon_api_key"
hamon_api_key: "your-api-encryption-key-here"
hamon_ota_password: "your-ota-password-here"
hamon_ap_password: "your-fallback-ap-password"

# These are the wifi credentials which can be used for any ESPHome device
wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"